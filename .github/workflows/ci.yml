name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Tests
        run: |
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q
      - name: Geen persoonsgegevens
        run: python -I plugins/nest-pro/scripts/anonimiseren.py controleer
