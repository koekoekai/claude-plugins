name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      NEST_PRIVACY_HERKENNER: regels
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Tests
        run: |
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q
      - name: Geen persoonsgegevens
        run: python -I plugins/nest-pro/scripts/anonimiseren.py controleer
